name: API matrix (26-36)

on:
  workflow_dispatch:
  push:
    branches: [ ci ]

permissions:
  contents: read

jobs:
  instrumented:
    name: API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, arch: x86 }
          - { api: 27, arch: x86 }
          - { api: 28, arch: x86_64 }
          - { api: 29, arch: x86_64 }
          - { api: 30, arch: x86_64 }
          - { api: 31, arch: x86_64 }
          - { api: 32, arch: x86_64 }
          - { api: 33, arch: x86_64 }
          - { api: 34, arch: x86_64 }
          - { api: 35, arch: x86_64 }
          - { api: 36, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run instrumented suites on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          script: |
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.studyapp.pomodoro.FeatureCoverageTest,com.studyapp.pomodoro.RuthlessFeatureTest \
              -Pandroid.testInstrumentationRunnerArguments.longRunning=false \
              --stacktrace --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api }}-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: ignore

      - name: Upload logcat
        if: failure()
        run: |
          adb logcat -d > logcat-api-${{ matrix.api }}.txt || true
          adb shell dumpsys activity > dumpsys-api-${{ matrix.api }}.txt || true

      - name: Upload logcat artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api }}-logcat
          path: |
            logcat-api-${{ matrix.api }}.txt
            dumpsys-api-${{ matrix.api }}.txt
          if-no-files-found: ignore
